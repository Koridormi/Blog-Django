{% extends '../base.html' %}

{% block title %}Crear Publicación | Mi Blog Personal{% endblock %}

{% block content %}
    <h1>Crear Publicación</h1>

    <form method="post" action="{% url 'posts:post_create' %}" novalidate>
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Crear Publicación</button>
    </form>

    <a href="{% url 'posts:post_list' %}">Volver al listado de publicaciones</a>
{% endblock %}
