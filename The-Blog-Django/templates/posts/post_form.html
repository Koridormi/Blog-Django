{% extends '../base.html' %}

{% block title %}{{ form_title }} | Mi Blog Personal{% endblock %}

{% block content %}
    <h1>{{ form_title }}</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">{{ form_title }}</button>
    </form>

    <a href="{% url 'posts:post_list' %}">Volver al listado de publicaciones</a>
{% endblock %}
